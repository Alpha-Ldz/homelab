apiVersion: apps/v1
kind: Deployment
metadata:
  name: homarr
  labels:
    app: homarr
spec:
  replicas: 1
  strategy:
    type: Recreate # volume RWO + base SQLite
  selector:
    matchLabels:
      app: homarr
  template:
    metadata:
      labels:
        app: homarr
    spec:
      # Service "toujours allumé" : reste sur les nœuds marqués always-on (le Pi),
      # jamais sur un worker réveillé à la demande (Wake-on-LAN).
      nodeSelector:
        homelab/always-on: "true"
      containers:
        - name: homarr
          image: ghcr.io/homarr-labs/homarr:v2.13.1
          ports:
            - name: http
              containerPort: 7575
          env:
            - name: TZ
              value: Europe/Paris
            - name: SECRET_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: homarr-secrets
                  key: SECRET_ENCRYPTION_KEY
          volumeMounts:
            - name: data
              mountPath: /appdata
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: homarr-data
