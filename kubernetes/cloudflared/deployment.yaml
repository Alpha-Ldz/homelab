# Connecteur Cloudflare Tunnel (tunnel géré depuis le dashboard Zero Trust).
# Les routes publiques pointent vers http://traefik.traefik.svc.cluster.local:80
# (alias vers le Traefik de K3s, voir traefik-alias.yaml) ; Traefik répartit ensuite
# par nom d'hôte (Ingress de chaque service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
  labels:
    app: cloudflared
spec:
  # 2 connecteurs : le tunnel reste joignable pendant un redémarrage/mise à jour
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      nodeSelector:
        homelab/always-on: "true"
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.0
          args:
            - tunnel
            - --no-autoupdate
            # QUIC (UDP 7844) ne passe pas sur ce réseau : on force HTTP/2 (TCP 443),
            # sinon la liveness probe tue le pod avant le repli automatique.
            - --protocol
            - http2
            - --metrics
            - 0.0.0.0:2000
            - run
          env:
            # cloudflared lit le token dans TUNNEL_TOKEN (pas exposé dans les args du process)
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-credentials
                  key: TUNNEL_TOKEN
          ports:
            - name: metrics
              containerPort: 2000
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
