# Photos/vidéos dans /srv/files/photos (dossier hôte -> futurs disques de données)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: immich-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-server
  template:
    metadata:
      labels:
        app: immich-server
    spec:
      nodeSelector:
        homelab/always-on: "true"
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.4.1
          env:
            - name: TZ
              value: Europe/Paris
            - name: DB_HOSTNAME
              value: database
            - name: DB_USERNAME
              value: immich
            - name: DB_DATABASE_NAME
              value: immich
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-secrets
                  key: DB_PASSWORD
            - name: REDIS_HOSTNAME
              value: valkey
            - name: IMMICH_MACHINE_LEARNING_URL
              value: http://machine-learning:3003
          ports:
            - name: http
              containerPort: 2283
          startupProbe:
            httpGet: &probe
              path: /api/server/ping
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: *probe
            periodSeconds: 15
          livenessProbe:
            httpGet: *probe
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: library
              mountPath: /data
      volumes:
        - name: library
          hostPath:
            path: /srv/files/photos
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
---
# Accès direct via Tailscale (sans Cloudflare, donc sans sa limite de 100 Mo par requête) :
# http://raspberrypi.tail0c5f5e.ts.net:30283 — à déclarer comme URL réseau local dans l'app mobile
apiVersion: v1
kind: Service
metadata:
  name: server-tailscale
spec:
  type: NodePort
  selector:
    app: immich-server
  ports:
    - name: http
      port: 2283
      targetPort: http
      nodePort: 30283
