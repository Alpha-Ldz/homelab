apiVersion: apps/v1
kind: Deployment
metadata:
  name: authelia
  labels:
    app: authelia
spec:
  replicas: 1
  strategy:
    type: Recreate # base SQLite sur volume RWO
  selector:
    matchLabels:
      app: authelia
  template:
    metadata:
      labels:
        app: authelia
    spec:
      nodeSelector:
        homelab/always-on: "true"
      enableServiceLinks: false # évite les variables AUTHELIA_* injectées par le Service
      containers:
        - name: authelia
          image: authelia/authelia:4.39.28
          ports:
            - name: http
              containerPort: 9091
          env:
            - name: TZ
              value: Europe/Paris
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/SESSION_SECRET
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/STORAGE_ENCRYPTION_KEY
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: /secrets/JWT_SECRET
            - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
              value: /secrets/oidc/HMAC_SECRET
            # Active {{ secret "..." }} dans configuration.yml (clé JWKS, digests clients)
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: template
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: secrets
              mountPath: /secrets
              readOnly: true
            - name: oidc
              mountPath: /secrets/oidc
              readOnly: true
            - name: users
              mountPath: /users
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: authelia-config
        - name: secrets
          secret:
            secretName: authelia-secrets
        - name: oidc
          secret:
            secretName: authelia-oidc
        - name: users
          secret:
            secretName: authelia-users
        - name: data
          persistentVolumeClaim:
            claimName: authelia-data
