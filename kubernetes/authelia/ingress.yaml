# Portail de connexion (pas de forward-auth sur lui-même)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authelia
  labels:
    app: authelia
spec:
  ingressClassName: traefik
  rules:
    - host: auth.freedom35.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: authelia
                port:
                  name: http
