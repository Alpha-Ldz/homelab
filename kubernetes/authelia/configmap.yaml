apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
data:
  configuration.yml: |
    # Secrets fournis par variables d'environnement *_FILE (Secret authelia-secrets).
    # Utilisateurs : Secret authelia-users (voir users_database.yml.example).
    theme: dark

    server:
      address: 'tcp://0.0.0.0:9091'
      endpoints:
        authz:
          forward-auth:
            implementation: 'ForwardAuth'

    log:
      level: 'info'

    totp:
      issuer: 'freedom35.fr'
      period: 30
      skew: 1

    authentication_backend:
      file:
        path: '/users/users_database.yml'
        watch: true
        password:
          algorithm: 'argon2'

    access_control:
      default_policy: 'deny'
      rules:
        # Mot de passe + TOTP obligatoires
        - domain:
            - 'home.freedom35.fr'
            - 'mainsail.freedom35.fr'
          policy: 'two_factor'

    session:
      cookies:
        - domain: 'freedom35.fr'
          authelia_url: 'https://auth.freedom35.fr'
          default_redirection_url: 'https://home.freedom35.fr'
          expiration: '12h'
          inactivity: '2h'
          remember_me: '1M'

    regulation:
      max_retries: 3
      find_time: '2m'
      ban_time: '15m'

    storage:
      local:
        path: '/data/db.sqlite3'

    # Fournisseur d'identité OIDC (SSO) : Homarr, Portainer.
    # Secrets dans le Secret authelia-oidc (monté sur /secrets/oidc), lus via le filtre template.
    identity_providers:
      oidc:
        jwks:
          - key_id: 'main'
            algorithm: 'RS256'
            use: 'sig'
            key: {{ secret "/secrets/oidc/jwks.pem" | mindent 10 "|" | msquote }}
        claims_policies:
          # Homarr lit les groupes dans l'id_token
          with_groups:
            id_token: ['email', 'email_verified', 'name', 'preferred_username', 'groups']
        clients:
          - client_id: 'homarr'
            client_name: 'Homarr'
            client_secret: '{{ secret "/secrets/oidc/HOMARR_CLIENT_SECRET_DIGEST" }}'
            public: false
            authorization_policy: 'two_factor'
            consent_mode: 'implicit'
            claims_policy: 'with_groups'
            redirect_uris:
              - 'https://home.freedom35.fr/api/auth/callback/oidc'
            scopes: ['openid', 'email', 'profile', 'groups']
            response_types: ['code']
            grant_types: ['authorization_code']
            token_endpoint_auth_method: 'client_secret_basic'
          - client_id: 'portainer'
            client_name: 'Portainer'
            client_secret: '{{ secret "/secrets/oidc/PORTAINER_CLIENT_SECRET_DIGEST" }}'
            public: false
            authorization_policy: 'two_factor'
            consent_mode: 'implicit'
            redirect_uris:
              # Portainer n'est pas publié : accès via Tailscale uniquement
              - 'https://raspberrypi.tail0c5f5e.ts.net:30779'
            scopes: ['openid', 'email', 'profile', 'groups']
            response_types: ['code']
            grant_types: ['authorization_code']
            token_endpoint_auth_method: 'client_secret_post'
            userinfo_signed_response_alg: 'none'

    # Pas de SMTP pour l'instant : les codes de vérification (enregistrement TOTP)
    # sont écrits dans ce fichier :
    #   kubectl -n authelia exec deploy/authelia -- cat /data/notification.txt
    notifier:
      filesystem:
        filename: '/data/notification.txt'
