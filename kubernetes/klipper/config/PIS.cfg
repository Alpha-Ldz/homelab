[mcu PIS]
# Accéléromètre RP2040 + ADXL345, vissé sur la tête (loin de la buse pour l'instant).
# Débrancher : commenter [include PIS.cfg] dans printer.cfg, sinon Klipper ne démarre pas.
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6635C469F8C3037-if00
restart_method: command

[adxl345]
cs_pin: PIS:gpio13
#spi_bus: spi1a
spi_software_sclk_pin: PIS:gpio10
spi_software_mosi_pin: PIS:gpio11
spi_software_miso_pin: PIS:gpio12
axes_map: -x,-z,y   # vérifié le 16/11/2026 (mouvements X/Y enregistrés)

[resonance_tester]
accel_chip: adxl345
probe_points:
    126,97,80   # centre, plateau descendu (câble USB vers le bas)
